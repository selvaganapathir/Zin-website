<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>ZIN Testnet Explorer — Local Demo</title><link rel="stylesheet" href="wallet.css"><link rel="icon" href="assets/favicon.svg"><script src="testnet.js" defer></script></head><body><header class="wallet-header"><a class="brand" href="./"><span class="brand-mark">Z</span><span>ZIN<span class="brand-dot">.</span></span></a><div class="header-right"><span class="network-pill"><i></i> LOCAL TESTNET</span><a class="back-link" href="wallet.html">Wallet ↗</a></div></header><main class="app-shell"><section class="intro-row"><div><div class="eyebrow">NETWORK DATA</div><h1>Testnet<br><span>Explorer.</span></h1></div><div class="demo-alert"><span>!</span><p><strong>Local browser chain.</strong> This explorer reads blocks saved by the wallet on this device. It is not a globally shared network.</p></div></section><section class="panel"><div class="chain-stats"><div><small>BLOCK HEIGHT</small><b id="height">0</b></div><div><small>BLOCKS STORED</small><b id="count">1</b></div><div><small>PENDING TX</small><b id="pending">0</b></div></div><label for="search">Search block height, hash or transaction text</label><input id="search" type="search" placeholder="Search blocks and transactions…"><div id="results" class="block-list"></div><p id="empty" class="form-message hidden">No matching records.</p><button id="export" class="secondary-button" type="button">Export chain JSON</button><label class="secondary-button" for="import-file">Import chain JSON</label><input id="import-file" type="file" accept="application/json" hidden><p id="message" class="form-message" role="status"></p><a class="primary-button" href="wallet.html">Open wallet & mine blocks →</a></section><footer class="wallet-footer"><a href="./">ZIN Project</a><a href="wallet.html">Wallet ↗</a></footer></main></body></html>
